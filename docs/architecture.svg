<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1540" role="img" aria-labelledby="title description">
  <title id="title">AIGC 漫剧 / 短剧创作工作流架构</title>
  <desc id="description">六阶段工作流：从故事拆解和五份 Markdown 创作契约，进入 Lookdev 资产准备、生产校验与逐镜确认，再经 Adapter 渲染并交付。总控、审查和 Google Flow 导出贯穿相关阶段。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="oklch(0.47 0.030 250)"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="oklch(0.45 0.100 110)"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="oklch(0.45 0.100 160)"/></marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="oklch(0.48 0.130 68)"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel { fill: oklch(0.985 0.006 110); stroke: oklch(0.88 0.018 250); stroke-width: 1.5; }
      .stage-title { fill: oklch(0.23 0.025 110); font-size: 16px; font-weight: 700; }
      .stage-note { fill: oklch(0.40 0.026 250); font-size: 12.5px; }
      .node-title { fill: oklch(0.23 0.025 110); font-size: 14px; font-weight: 650; }
      .node-note { fill: oklch(0.40 0.026 250); font-size: 12px; }
      .arrow { fill: none; stroke: oklch(0.47 0.030 250); stroke-width: 2; marker-end: url(#arrow); }
      .cross-arrow { fill: none; stroke: oklch(0.53 0.022 250); stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .node-olive { fill: oklch(0.96 0.030 110); stroke: oklch(0.76 0.050 110); }
      .node-paper { fill: oklch(0.97 0.025 85); stroke: oklch(0.78 0.070 85); }
      .node-green { fill: oklch(0.96 0.035 155); stroke: oklch(0.73 0.070 155); }
      .node-gate { fill: oklch(0.97 0.025 68); stroke: oklch(0.75 0.080 68); }
      .node-confirm { fill: oklch(0.96 0.030 30); stroke: oklch(0.62 0.120 30); }
      .node-render { fill: oklch(0.96 0.025 205); stroke: oklch(0.74 0.060 205); }
      .node-deliver { fill: oklch(0.96 0.025 295); stroke: oklch(0.72 0.060 295); }
    </style>
  </defs>
  <rect width="1120" height="1540" fill="oklch(1.000 0.000 0)"/>
  <text x="40" y="54" fill="oklch(0.23 0.025 110)" font-size="26" font-weight="720">AIGC 漫剧 / 短剧创作工作流</text>
  <text x="40" y="82" fill="oklch(0.40 0.026 250)" font-size="14">从故事拆解到成片交付：创作状态写入文档，付费渲染由创作者逐镜确认。</text>
  <g transform="translate(40 112)">
    <circle cx="5" cy="0" r="5" fill="oklch(0.45 0.100 110)"/><text x="17" y="4" fill="oklch(0.40 0.026 250)" font-size="12">创作流程</text>
    <circle cx="112" cy="0" r="5" fill="oklch(0.45 0.100 160)"/><text x="124" y="4" fill="oklch(0.40 0.026 250)" font-size="12">Lookdev 资产</text>
    <circle cx="260" cy="0" r="5" fill="oklch(0.48 0.130 68)"/><text x="272" y="4" fill="oklch(0.40 0.026 250)" font-size="12">人工确认门禁</text>
  </g>

  <rect class="panel" x="40" y="145" width="1040" height="145" rx="12"/>
  <text class="stage-title" x="62" y="178">1 · 拆解改编</text>
  <text class="stage-note" x="230" y="178">从原著或想法形成故事方案</text>
  <rect class="node-olive" x="70" y="204" width="230" height="62" rx="9"/>
  <text class="node-title" x="185" y="230" text-anchor="middle">长篇小说 / 故事想法</text>
  <text class="node-note" x="185" y="250" text-anchor="middle">创作者输入</text>
  <rect class="node-olive" x="430" y="204" width="230" height="62" rx="9"/>
  <text class="node-title" x="545" y="230" text-anchor="middle">分析提取</text>
  <text class="node-note" x="545" y="250" text-anchor="middle">short-drama-novel-analyze</text>
  <rect class="node-olive" x="790" y="204" width="230" height="62" rx="9"/>
  <text class="node-title" x="905" y="230" text-anchor="middle">故事引擎与分集方案</text>
  <text class="node-note" x="905" y="250" text-anchor="middle">short-drama-develop</text>
  <path class="arrow" d="M300 235 H422"/>
  <path class="arrow" d="M660 235 H782"/>

  <rect class="panel" x="40" y="310" width="1040" height="350" rx="12"/>
  <text class="stage-title" x="62" y="344">2 · 五份 Markdown 契约与 Lookdev 资产</text>
  <text class="stage-note" x="62" y="366">各文档由对应 Skill 维护；图片提示词与分镜并行产出</text>
  <rect class="node-paper" x="70" y="392" width="190" height="70" rx="9"/>
  <text class="node-title" x="165" y="420" text-anchor="middle">剧本.md</text>
  <text class="node-note" x="165" y="442" text-anchor="middle">short-drama-write</text>
  <rect class="node-paper" x="330" y="392" width="200" height="70" rx="9"/>
  <text class="node-title" x="430" y="420" text-anchor="middle">视觉设定.md</text>
  <text class="node-note" x="430" y="442" text-anchor="middle">short-drama-assets</text>
  <rect class="node-paper" x="610" y="392" width="210" height="70" rx="9"/>
  <text class="node-title" x="715" y="420" text-anchor="middle">图片提示词.md</text>
  <text class="node-note" x="715" y="442" text-anchor="middle">short-drama-image-prompts</text>
  <rect class="node-paper" x="330" y="500" width="200" height="70" rx="9"/>
  <text class="node-title" x="430" y="528" text-anchor="middle">分镜.md</text>
  <text class="node-note" x="430" y="550" text-anchor="middle">short-drama-storyboard</text>
  <rect class="node-paper" x="610" y="500" width="210" height="70" rx="9"/>
  <text class="node-title" x="715" y="528" text-anchor="middle">视频提示词.md</text>
  <text class="node-note" x="715" y="550" text-anchor="middle">short-drama-video-prompts</text>
  <rect class="node-green" x="850" y="392" width="200" height="70" rx="9"/>
  <text class="node-title" x="950" y="420" text-anchor="middle">资产渲染调度</text>
  <text class="node-note" x="950" y="442" text-anchor="middle">角色 / 场景 / 道具</text>
  <rect class="node-green" x="850" y="500" width="200" height="70" rx="9"/>
  <text class="node-title" x="950" y="528" text-anchor="middle">assets/lookdev/</text>
  <text class="node-note" x="950" y="550" text-anchor="middle">定妆图与场景参考</text>
  <path class="arrow" d="M260 427 H322"/>
  <path class="arrow" d="M530 427 H602"/>
  <path class="arrow" d="M430 462 V492"/>
  <path class="arrow" d="M715 462 V492"/>
  <path class="arrow" d="M530 535 H602"/>
  <path d="M820 427 H842" fill="none" stroke="oklch(0.45 0.100 160)" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M950 462 V492" fill="none" stroke="oklch(0.45 0.100 160)" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="62" y="616" fill="oklch(0.40 0.026 250)" font-size="12">五份正式文档：剧本、视觉设定、图片提示词、分镜、视频提示词。资产参考图存入本地 Lookdev 库。</text>

  <rect class="panel" x="40" y="690" width="1040" height="165" rx="12"/>
  <text class="stage-title" x="62" y="724">3–4 · 生产门禁</text>
  <text class="stage-note" x="230" y="724">分镜、视频提示词与 Lookdev 资产汇入生产任务</text>
  <rect class="node-gate" x="70" y="754" width="235" height="72" rx="9"/>
  <text class="node-title" x="187" y="782" text-anchor="middle">short-drama-produce</text>
  <text class="node-note" x="187" y="805" text-anchor="middle">按镜头建立生产任务</text>
  <rect class="node-gate" x="420" y="754" width="250" height="72" rx="9"/>
  <text class="node-title" x="545" y="782" text-anchor="middle">prepare · 二值校验</text>
  <text class="node-note" x="545" y="805" text-anchor="middle">检查任务并预览成本</text>
  <rect class="node-confirm" x="785" y="754" width="250" height="72" rx="9" stroke-width="1.6"/>
  <text class="node-title" x="910" y="782" text-anchor="middle">confirm · SHA-256</text>
  <text class="node-note" x="910" y="805" text-anchor="middle">创作者确认后锁定当前任务</text>
  <path class="arrow" d="M305 790 H412"/>
  <path d="M670 790 H777" fill="none" stroke="oklch(0.48 0.130 68)" stroke-width="2" marker-end="url(#arrow-rust)"/>
  <text x="910" y="842" text-anchor="middle" fill="oklch(0.38 0.090 30)" font-size="11.5">参数变化后，旧确认失效</text>

  <rect class="panel" x="40" y="885" width="1040" height="170" rx="12"/>
  <text class="stage-title" x="62" y="919">5 · Adapter 跨平台渲染</text>
  <text class="stage-note" x="340" y="919">通过确认后，按单镜授权启动配置的平台</text>
  <rect class="node-render" x="62" y="947" width="220" height="74" rx="9"/>
  <text class="node-title" x="172" y="976" text-anchor="middle">Adapter 路由</text>
  <text class="node-note" x="172" y="999" text-anchor="middle">读取平台配置</text>
  <rect class="node-render" x="322" y="947" width="220" height="74" rx="9"/>
  <text class="node-title" x="432" y="976" text-anchor="middle">文生图 / 首帧绑定</text>
  <text class="node-note" x="432" y="999" text-anchor="middle">引用 Lookdev 参考图</text>
  <rect class="node-render" x="582" y="947" width="220" height="74" rx="9"/>
  <text class="node-title" x="692" y="976" text-anchor="middle">图生视频（I2V）</text>
  <text class="node-note" x="692" y="999" text-anchor="middle">首帧 + 动态提示词</text>
  <rect class="node-render" x="842" y="947" width="210" height="74" rx="9"/>
  <text class="node-title" x="947" y="976" text-anchor="middle">TTS 配音 / 音效</text>
  <text class="node-note" x="947" y="999" text-anchor="middle">按时间线生成音频</text>
  <path d="M910 826 V932 H172 V939" fill="none" stroke="oklch(0.45 0.100 110)" stroke-width="2" marker-end="url(#arrow-olive)"/>
  <path class="arrow" d="M282 984 H314"/>
  <path class="arrow" d="M542 984 H574"/>
  <path class="arrow" d="M802 984 H834"/>

  <rect class="panel" x="40" y="1085" width="1040" height="150" rx="12"/>
  <text class="stage-title" x="62" y="1119">6 · 合成与交付</text>
  <text class="stage-note" x="250" y="1119">工作流交付素材与生产包，创作者完成最终剪辑</text>
  <rect class="node-deliver" x="160" y="1143" width="330" height="66" rx="9"/>
  <text class="node-title" x="325" y="1171" text-anchor="middle">FFmpeg / 剪映草稿</text>
  <text class="node-note" x="325" y="1193" text-anchor="middle">创作者剪辑与节奏调整</text>
  <rect class="node-deliver" x="630" y="1143" width="330" height="66" rx="9"/>
  <text class="node-title" x="795" y="1171" text-anchor="middle">成片与交付包</text>
  <text class="node-note" x="795" y="1193" text-anchor="middle">素材、项目文件与最终成片</text>
  <path class="arrow" d="M947 1021 V1070 H325 V1135"/>
  <path class="arrow" d="M490 1176 H622"/>

  <rect x="40" y="1280" width="1040" height="220" rx="12" fill="oklch(0.985 0.006 110)" stroke="oklch(0.84 0.020 250)" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="62" y="1314" fill="oklch(0.28 0.025 250)" font-size="15" font-weight="700">横切服务</text>
  <text x="180" y="1314" fill="oklch(0.40 0.026 250)" font-size="12.5">按需介入，不替代阶段 owner</text>
  <rect x="70" y="1342" width="290" height="112" rx="9" fill="oklch(1.000 0.000 0)" stroke="oklch(0.80 0.020 250)"/>
  <text class="node-title" x="215" y="1376" text-anchor="middle">short-drama · 总控与路由</text>
  <text class="node-note" x="215" y="1402" text-anchor="middle">初始化 · 项目配置 · Dashboard</text>
  <text class="node-note" x="215" y="1426" text-anchor="middle">协调各阶段 Skill</text>
  <rect x="415" y="1342" width="290" height="112" rx="9" fill="oklch(1.000 0.000 0)" stroke="oklch(0.80 0.020 250)"/>
  <text class="node-title" x="560" y="1376" text-anchor="middle">short-drama-review · 审查</text>
  <text class="node-note" x="560" y="1402" text-anchor="middle">按文件、镜头和证据定位问题</text>
  <text class="node-note" x="560" y="1426" text-anchor="middle">路由回创作或生产阶段</text>
  <rect x="760" y="1342" width="290" height="112" rx="9" fill="oklch(1.000 0.000 0)" stroke="oklch(0.80 0.020 250)"/>
  <text class="node-title" x="905" y="1376" text-anchor="middle">google-flow-manga</text>
  <text class="node-note" x="905" y="1402" text-anchor="middle">导出逐镜检查与执行所需素材</text>
  <text class="node-note" x="905" y="1426" text-anchor="middle">对接 Google Flow 工作流</text>
  <text x="62" y="1480" fill="oklch(0.40 0.026 250)" font-size="11.5">实线箭头：主流程　　虚线箭头：横切服务介入　　prepare：校验与预览　　confirm：逐镜授权</text>
</svg>
